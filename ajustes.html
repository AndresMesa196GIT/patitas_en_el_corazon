<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Ajustes - Patitas en Colombia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #fdf6ec;
            color: #333;
            height: 100vh;
            position: fixed;
            overflow-y: auto;
            padding: 20px;
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }

        .sidebar nav li {
            margin: 10px 0;
        }

        .sidebar a {
            text-decoration: none;
            color: #333;
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        .sidebar a:hover {
            background-color: #f3eeed;
        }

        .sidebar .bottom-options {
            position: absolute;
            bottom: 20px;
            width: 90%;
        }

        main {
            margin-left: 250px;
            padding: 40px;
            flex: 1;
            overflow-y: auto;
            background-color: #fff;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            max-width: 150px;
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .botones-ajustes {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .boton-ajuste {
            padding: 10px 20px;
            background-color: #e9ecef;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        form {
            background-color: #f9f9f9;
            padding: 30px;
            border-radius: 8px;
            max-width: 900px;
            margin: auto;
        }

        .campo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .etiqueta {
            font-weight: bold;
            color: #4a5568;
        }

        input, select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #fff;
            width: 100%;
        }

        button[type="submit"] {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: block;
            margin-top: 20px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #888;
        }

        .footer-links a {
            margin: 0 10px;
            text-decoration: none;
            color: #888;
        }

        .social-icons i {
            margin: 0 5px;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<aside class="sidebar">
    <div class="logo">
        <img src="CSS/images/logo.jpg" alt="Logo Patitas" />
    </div>
    <nav>
        <ul>
            <li><a href="index.html">🐾 Inicio</a></li>
            <li><a href="adopciones.html">🐕 Adopciones</a></li>
            <li><a href="eventos.html">🗓️ Eventos</a></li>
            <li><a href="Donaciones.html">💰 Donaciones</a></li>
            <li><a href="reportes.html">📄 Reportes</a></li>
            <li><a href="usuarios.html">👨‍👩‍👧‍👦 Usuarios</a></li>
            <li><a href="juguetes.html">🥎 Juguetes</a></li>
        </ul>
    </nav>
    <div class="bottom-options">
        <ul>
            <li><a href="ajustes.html">⚙️ Ajustes</a></li>
            <li onclick="cerrarSesion()" style="cursor:pointer;">🚪 Cerrar sesión</li>
        </ul>
    </div>
</aside>

<!-- Contenido principal -->
<main>
    <h2>Ajustes 🐾</h2>

    <div class="botones-ajustes">
        <button class="boton-ajuste">Personal Info</button>
        <button class="boton-ajuste">Contraseña y Seguridad</button>
        <button class="boton-ajuste">Notificación</button>
        <button class="boton-ajuste">Elige un plan</button>
    </div>

    <!-- Formulario -->
    <form>
        <div class="campo">
            <span class="etiqueta">Nombre</span>
            <input type="text" value="Nicola" />
            <span class="etiqueta">Apellido</span>
            <input type="text" value="Rich" />
        </div>

        <div class="campo" style="grid-template-columns: 1fr;">
            <span class="etiqueta">Email</span>
            <input type="email" value="email@gmail.com" />
        </div>

        <div class="campo" style="grid-template-columns: 1fr;">
            <span class="etiqueta">Teléfono</span>
            <input type="tel" value="+000 111 222 333" />
        </div>

        <div class="campo" style="grid-template-columns: 1fr;">
            <span class="etiqueta">Dirección</span>
            <input type="text" value="Sesame Street 000" />
        </div>

        <div class="campo">
            <span class="etiqueta">Código Postal</span>
            <input type="text" value="1234" />
            <span class="etiqueta">Ciudad</span>
            <input type="text" value="NYC" />
        </div>

        <div class="campo">
            <span class="etiqueta">Estado</span>
            <input type="text" value="New York" />
            <span class="etiqueta">País</span>
            <select>
                <option>United States</option>
                <option>México</option>
                <option>Colombia</option>
            </select>
        </div>

        <button type="submit">Guardar Cambios</button>
    </form>

    <footer>
        <p>Patitas en el Corazón</p>
        <div class="footer-links">
            <a href="#">Acerca</a>
            <a href="#">Autores</a>
            <a href="#">Archivo</a>
            <a href="#">Términos</a>
            <a href="#">Cookies</a>
        </div>
        <div class="social-icons">
            <i class="fab fa-twitter"></i>
            <i class="fab fa-facebook"></i>
            <i class="fab fa-instagram"></i>
        </div>
    </footer>
</main>

<script>
    function cerrarSesion() {
        window.location.href = "index.html";
    }
</script>
</body>
</html>
